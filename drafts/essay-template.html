<!DOCTYPE html>
<!--
  Starting point for a new standalone page. COPY THIS FILE — do not copy the
  last essay you shipped, which is how the stylesheet version and the nav markup
  drifted apart in the first place.

  To add a page called SLUG:
    1. cp drafts/essay-template.html SLUG/index.html   (a DIRECTORY, not SLUG.html)
    2. Replace every SLUG / TITLE / DESCRIPTION / DATE placeholder below.
    3. Add the card to the Archive list in index.html, linking to "/SLUG/".
    4. ./check-site.sh
    5. Add a dated NOTES.md entry in the same commit.

  Two rules the checker enforces, both of which silently break the page:
    - Every in-page path must start with "/". A relative "styles.css" resolves
      to "/SLUG/styles.css" and 404s, leaving an unstyled page with no nav.
    - Internal links to these pages carry a trailing slash ("/loyalty/"), because
      a directory index without one costs a 301 redirect hop.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TITLE | Omeed Tavakoli</title>
  <meta name="description" content="DESCRIPTION">
  <link rel="canonical" href="https://omeedtavakoli.com/SLUG/">
  <!-- favicon + manifest links are injected by essay-chrome.js -->
  <meta name="theme-color" content="#1a1a1a">

  <!-- Open Graph / Social sharing -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="TITLE">
  <meta property="og:description" content="DESCRIPTION">
  <meta property="og:url" content="https://omeedtavakoli.com/SLUG/">
  <meta property="og:image" content="https://omeedtavakoli.com/images/SLUG.png">

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TITLE">
  <meta name="twitter:description" content="DESCRIPTION">
  <meta name="twitter:site" content="@omeedtavakoli">
  <meta name="twitter:image" content="https://omeedtavakoli.com/images/SLUG.png">

  <link rel="stylesheet" href="/styles.css?v=89">
</head>
<body class="essay-page">
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- Site header. This markup is duplicated verbatim across every essay page
       so it paints with the HTML instead of waiting on JS. Do not hand-edit one
       copy: change drafts/essay-template.html, mirror it everywhere, and run
       ./check-site.sh, which fails if the copies drift apart. -->
  <header>
    <nav class="nav-links" aria-label="Primary">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link" href="/#about">About</a>
      <a class="nav-link active" href="/#archive">Archive</a>
      <a class="nav-link" href="https://www.linkedin.com/in/omeedtavakoli/" target="_blank" rel="noopener">Resume</a>
      <a class="nav-link" href="https://x.com/omeedtavakoli" target="_blank" rel="noopener">Contact</a>
    </nav>
    <a class="media-assets-link" href="https://x.com/omeedtavakoli/photo" target="_blank" rel="noopener">Headshot</a>
  </header>

  <script src="/essay-chrome.js?v=8"></script>

  <main class="essay-main" id="main-content" tabindex="-1">
    <article class="essay-article">
      <h1>TITLE</h1>
      <p class="essay-meta">by Omeed Tavakoli, DATE</p>

      <p class="essay-lead">First paragraph.</p>

      <p>Body.</p>
    </article>
  </main>

  <footer>
    <span id="time"></span>
    <span id="date"></span>
  </footer>
</body>
</html>
